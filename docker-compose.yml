version: '3.8'

services:
  platform-backend:
    build:
      context: .
      dockerfile: platform/backend/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DB_PATH=/data/platform.db
      - PHISHSHIELD_URL=http://phishshield-backend:8000
      - PHISFENCE_URL=http://phisfence-api:5000
    volumes:
      - platform-data:/data

  phishshield-backend:
    build:
      context: ./phishshield/backend
    ports:
      - "8000:8000"

  phisfence-api:
    build:
      context: ./phisfence/monitor-api
    ports:
      - "5000:5000"

  soc-dashboard:
    build:
      context: ./platform/frontend
    ports:
      - "5173:5173"

volumes:
  platform-data:
