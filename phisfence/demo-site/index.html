<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PhishFence Demo - Official Site</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Load protection lib. For demo we load source directly. In prod use obfuscated dist -->
  <script>
    // small config injected before library loads
    window.PROTECT_MONITOR_URL = "http://localhost:5000";
  </script>
  <script src="../protect-lib/src/index.js" defer></script>
</head>
<body>
  <main>
    <h1>AcmeBank - Official Demo</h1>
    <p>This is the official demo site protected by PhishFence.</p>

    <section class="login">
      <h2>Login</h2>
      <form onsubmit="event.preventDefault(); alert('Logged in (demo)')">
        <label>
          Email
          <input type="email" required />
        </label>
        <label>
          Password
          <input type="password" required />
        </label>
        <button type="submit">Login</button>
      </form>
    </section>

    <footer>
      <small>PhishFence demo</small>
    </footer>
  </main>
</body>
</html>
